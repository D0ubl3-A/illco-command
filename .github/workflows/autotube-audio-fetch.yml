name: AutoTube AI voice fetch

on:
  push:
    branches:
      - autotube/audio-fetch-20260904
  workflow_dispatch:

jobs:
  fetch-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download AI Voice Generator scene audio
        run: |
          mkdir -p audio
          curl -fL --retry 3 --retry-delay 1 "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/d9499e24-85c8-4cf0-9d7a-7fa296542363.mp3" -o "audio/scene_01.mp3"
          curl -fL --retry 3 --retry-delay 1 "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/2cedbdd0-a0cf-4d29-9171-75ad50799387.mp3" -o "audio/scene_02.mp3"
          curl -fL --retry 3 --retry-delay 1 "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/ac2aedfe-7980-49e9-bc2e-cefed18b399e.mp3" -o "audio/scene_03.mp3"
          curl -fL --retry 3 --retry-delay 1 "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/debeaf35-1ad5-4556-a754-e9bc3c2a382a.mp3" -o "audio/scene_04.mp3"
          curl -fL --retry 3 --retry-delay 1 "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/e3ff3128-48f9-4195-bd29-cf33f88d79a7.mp3" -o "audio/scene_05.mp3"
          curl -fL --retry 3 --retry-delay 1 "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/a70e00a5-e8e2-4cb2-90c2-27802facb96d.mp3" -o "audio/scene_06.mp3"
          curl -fL --retry 3 --retry-delay 1 "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/275f8efe-89f0-41b1-b81a-63443376543d.mp3" -o "audio/scene_07.mp3"
          curl -fL --retry 3 --retry-delay 1 "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/9724c079-3491-4976-bacd-7f165a4bde92.mp3" -o "audio/scene_08.mp3"
          curl -fL --retry 3 --retry-delay 1 "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/6282aae5-5fba-4fc1-ba88-47ddbbca4856.mp3" -o "audio/scene_09.mp3"
          curl -fL --retry 3 --retry-delay 1 "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/6cc74ab9-f8e1-4dd9-b249-88a3325f91b1.mp3" -o "audio/scene_10.mp3"
          ls -lh audio
      - name: Upload AI voice artifact
        uses: actions/upload-artifact@v4
        with:
          name: autotube-ai-deep-voice
          path: audio/
          if-no-files-found: error
          retention-days: 1
