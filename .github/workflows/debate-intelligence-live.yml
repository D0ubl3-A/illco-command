name: Verify Debate Intelligence production MCP

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: debate-intelligence-live-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify_di2_live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live Debate Intelligence MCP end to end
        shell: bash
        env:
          MCP_URL: https://illcoai.tech/api/chatgpt/debate-intelligence/mcp
          WIDGET_URL: https://illcoai.tech/api/chatgpt/debate-intelligence/widget
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location --max-time 30 "$MCP_URL" > health.json
          curl --fail --silent --show-error --location --max-time 30 "$WIDGET_URL" > widget.html
          curl --fail --silent --show-error --location --max-time 30 --header 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"di2-live-smoke","version":"1.0.0"}}}' "$MCP_URL" > initialize.json
          curl --fail --silent --show-error --location --max-time 30 --header 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' "$MCP_URL" > tools.json
          curl --fail --silent --show-error --location --max-time 30 --header 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"render_debate_studio","arguments":{"title":"DI2 production smoke","topic":"MCP registry parity"}}}' "$MCP_URL" > render.json
          curl --fail --silent --show-error --location --max-time 30 --header 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":4,"method":"resources/read","params":{"uri":"ui://illco/debate-intelligence/studio-v1.html"}}' "$MCP_URL" > resource.json

          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path('health.json').read_text())
          initialize = json.loads(Path('initialize.json').read_text())
          tools_payload = json.loads(Path('tools.json').read_text())
          render = json.loads(Path('render.json').read_text())
          resource = json.loads(Path('resource.json').read_text())
          tool_names = {str(tool.get('name')) for tool in ((tools_payload.get('result') or {}).get('tools') or [])}

          print('HEALTH=', json.dumps(health, sort_keys=True))
          print('TOOLS=', sorted(tool_names))
          print('RENDER=', json.dumps(render, sort_keys=True))

          assert health.get('status') == 'ready', health
          assert health.get('endpoint') == '/api/chatgpt/debate-intelligence/mcp', health
          assert initialize.get('result'), initialize
          assert 'render_debate_studio' in tool_names, tool_names
          assert 'run_debate_youtube_pipeline' in tool_names, tool_names
          assert not render.get('error'), render
          result = render.get('result') or {}
          assert (result.get('structuredContent') or {}).get('studioStatus') == 'ready', render
          assert (result.get('_meta') or {}).get('ui', {}).get('resourceUri') == 'ui://illco/debate-intelligence/studio-v1.html', render
          contents = (resource.get('result') or {}).get('contents') or []
          assert contents, resource
          assert contents[0].get('mimeType') == 'text/html;profile=mcp-app', resource
          assert len(Path('widget.html').read_bytes()) > 500
          print('Debate Intelligence production MCP smoke test passed')
          PY
