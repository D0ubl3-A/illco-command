name: Deploy Occasions Demo to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-occasions-pages.yml"
      - "tools/render_occasions_elevenlabs.py"
      - "tools/build_occasions_pages.py"
      - "autotube/occasions/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: occasions-github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      AUTOTUBE_ELEVENLABS_VOICE_ID: ${{ secrets.AUTOTUBE_ELEVENLABS_VOICE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation
          python -m pip install --upgrade pip
          pip install pillow requests

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Occasions media
        shell: bash
        run: |
          if [ -n "${ELEVENLABS_API_KEY}" ]; then
            python tools/render_occasions_elevenlabs.py
          else
            echo "ELEVENLABS_API_KEY is not configured; deploying secure pending-status page."
            python - <<'PY'
          from tools import render_occasions_elevenlabs as renderer
          slides = [renderer.create_slide(index, scene) for index, scene in enumerate(renderer.SCENES, 1)]
          renderer.contact_sheet(slides)
          PY
          fi

      - name: Build static player
        run: python tools/build_occasions_pages.py

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/occasions

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
