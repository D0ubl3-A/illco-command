name: Green100 Next.js security upgrade

on:
  push:
    paths:
      - ".github/workflows/green100-next-upgrade.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate patched lockfile
        run: npm install next@16.3.4 --save-exact

      - name: Production dependency audit
        shell: bash
        run: |
          npm audit --omit=dev --json > production-audit.json || true
          node - <<'NODE'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync("production-audit.json", "utf8"));
          const v = report.metadata?.vulnerabilities || {};
          console.log("production audit", v);
          if ((v.critical || 0) > 0 || (v.high || 0) > 0) process.exit(1);
          NODE

      - name: Type check
        run: npx tsc --noEmit --pretty false

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload upgrade evidence
        uses: actions/upload-artifact@v4
        with:
          name: green100-next-16-3-4
          path: |
            package.json
            package-lock.json
            production-audit.json
          retention-days: 2
