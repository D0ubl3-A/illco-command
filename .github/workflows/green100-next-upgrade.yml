name: Green100 Next.js security upgrade

on:
  push:
    paths:
      - ".github/workflows/green100-next-upgrade.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare patched dependency policy
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          pkg.dependencies.next = "16.3.4";
          pkg.overrides = {
            ...(pkg.overrides || {}),
            "postcss": "8.5.23",
            "nanoid": "3.3.18",
            "fast-uri": "3.1.7",
            "ip-address": "10.7.0"
          };
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          NODE
          npm install

      - name: Production dependency audit
        shell: bash
        run: |
          npm audit --omit=dev --json > production-audit.json || true
          node - <<'NODE'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync("production-audit.json", "utf8"));
          const summary = report.metadata?.vulnerabilities || {};
          console.log("production audit", summary);
          const vulns = report.vulnerabilities || {};
          for (const [name, info] of Object.entries(vulns)) {
            if (!["high", "critical"].includes(info.severity)) continue;
            const via = (info.via || []).map((v) => typeof v === "string" ? v : {
              source: v.source,
              name: v.name,
              severity: v.severity,
              title: v.title,
              range: v.range,
              url: v.url,
            });
            console.log(JSON.stringify({
              name,
              severity: info.severity,
              range: info.range,
              fixAvailable: info.fixAvailable,
              via,
            }));
          }
          if ((summary.critical || 0) > 0 || (summary.high || 0) > 0) process.exit(1);
          NODE

      - name: Type check
        run: npx tsc --noEmit --pretty false

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload upgrade evidence
        uses: actions/upload-artifact@v4
        with:
          name: green100-secure-deps
          path: |
            package.json
            package-lock.json
            production-audit.json
          retention-days: 2
