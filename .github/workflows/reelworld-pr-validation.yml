name: ReelWorld PR Validation

on:
  pull_request:
    branches:
      - deploy/reelworld-go
    paths:
      - 'app/reelworld-go/**'
      - 'tests/**reelworld**'
      - 'tests/**water**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/reelworld-pr-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reelworld-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Water Scan + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ReelWorld Water Scan tests
        run: npm test -- --test-name-pattern='Water|water|ReelWorld|reelworld'

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
