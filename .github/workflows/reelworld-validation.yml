name: ReelWorld Production Validation

on:
  push:
    branches:
      - deploy/reelworld-go
    paths:
      - "app/apps/reelworld-go/**"
      - "app/manifest.ts"
      - "public/reelworld-go/**"
      - "tests/reelworld-*.test.ts"
      - ".github/workflows/reelworld-validation.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reelworld-production-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply non-breaking security fixes
        run: npm audit fix
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Water Scan benchmark
        run: npx tsx --test tests/reelworld-water-detection.test.ts
      - name: Gameplay acceptance matrix
        run: npx tsx --test tests/reelworld-gameplay.test.ts
      - name: Type check
        run: npx tsc --noEmit --pretty false
      - name: Production build
        run: npm run build
      - name: Persist verified lockfile fixes
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency lock changes needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore: apply verified ReelWorld dependency fixes [skip ci]"
            git push origin HEAD:deploy/reelworld-go
          fi
