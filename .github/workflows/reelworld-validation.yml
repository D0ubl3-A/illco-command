name: ReelWorld Production Validation

on:
  push:
    branches:
      - deploy/reelworld-go
    paths:
      - "app/apps/reelworld-go/**"
      - "app/manifest.ts"
      - "public/reelworld-go/**"
      - "tests/reelworld-*.test.ts"
      - ".github/workflows/reelworld-validation.yml"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reelworld-production-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply non-breaking security fixes
        run: npm audit fix
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Water Scan benchmark
        run: npx tsx --test tests/reelworld-water-detection.test.ts
      - name: Gameplay acceptance matrix
        run: npx tsx --test tests/reelworld-gameplay.test.ts
      - name: PWA service-worker syntax
        run: node --check public/reelworld-go/sw.js
      - name: Type check
        run: npx tsc --noEmit --pretty false
      - name: Production build
        run: npm run build
      - name: Built route and PWA smoke
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -p 3010 > /tmp/reelworld-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3010/apps/reelworld-go > /tmp/reelworld-app.html; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then cat /tmp/reelworld-next.log; exit 1; fi
          grep -qi "ReelWorld" /tmp/reelworld-app.html
          curl -fsSL http://127.0.0.1:3010/play > /tmp/reelworld-play.html
          grep -qi "ReelWorld" /tmp/reelworld-play.html
          curl -fsSL http://127.0.0.1:3010/scan-benchmark > /tmp/reelworld-scan.html
          grep -qi "Water Scan" /tmp/reelworld-scan.html
          curl -fsS http://127.0.0.1:3010/manifest.webmanifest > /tmp/reelworld-manifest.json
          grep -q '"start_url":"/play"' /tmp/reelworld-manifest.json
          curl -fsSI http://127.0.0.1:3010/reelworld-go/sw.js > /tmp/reelworld-sw-headers.txt
          grep -qi '^service-worker-allowed: /' /tmp/reelworld-sw-headers.txt
          curl -fsS http://127.0.0.1:3010/reelworld-go/sw.js | grep -q 'reelworld-go-v5'
      - name: Persist verified lockfile fixes
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency lock changes needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore: apply verified ReelWorld dependency fixes [skip ci]"
            git push origin HEAD:deploy/reelworld-go
          fi
