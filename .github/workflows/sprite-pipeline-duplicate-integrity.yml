name: Sprite Pipeline Duplicate Integrity

on:
  push:
    branches:
      - sprite-pipeline-to-10k
    paths:
      - 'sprite-pipeline/**'
      - '.github/workflows/sprite-pipeline-duplicate-integrity.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'sprite-pipeline/**'
      - '.github/workflows/sprite-pipeline-duplicate-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-duplicate-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap transactional state
        run: python sprite-pipeline/scripts/bootstrap_state.py
      - name: Verify duplicate signatures, thresholds, canonical pairs and exceptions
        run: python sprite-pipeline/scripts/test_duplicate_integrity.py
      - name: Verify duplicate-stack schema is present
        run: |
          python - <<'PY'
          import sqlite3
          db='sprite-pipeline/state/pipeline.sqlite3'
          with sqlite3.connect(db) as con:
              for table in ('duplicate_thresholds','asset_signatures','duplicate_candidates','similarity_exceptions'):
                  assert con.execute("select count(*) from sqlite_master where type='table' and name=?", (table,)).fetchone()[0] == 1
              assert con.execute('select count(*) from duplicate_thresholds').fetchone()[0] >= 8
          print('duplicate schema invariants passed')
          PY
