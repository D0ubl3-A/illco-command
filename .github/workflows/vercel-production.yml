name: Verify ILLCO Command for Sites

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      verify_live:
        description: Verify the published illcoai.tech Site and AutoTube MCP
        required: false
        type: boolean
        default: true

concurrency:
  group: illco-command-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/autotube-renderer/requirements.txt

      - name: Install AutoTube renderer dependencies
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg fonts-dejavu-core
          fi
          python -m pip install --requirement services/autotube-renderer/requirements.txt

      - name: Verify AutoTube renderer with a real FFmpeg smoke render
        shell: bash
        env:
          AUTOTUBE_DATA_DIR: ${{ runner.temp }}/autotube-data
          OPENMONTAGE_DATA_DIR: ${{ runner.temp }}/openmontage-data
          AUTOTUBE_RENDER_SERVICE_TOKEN: github-actions-test-token
        run: |
          python -m py_compile services/autotube-renderer/app.py services/autotube-renderer/smoke_test.py
          python services/autotube-renderer/smoke_test.py

      - name: Type check
        shell: bash
        run: npx tsc --noEmit --pretty false

      - name: Test
        shell: bash
        run: npm test

      - name: Build Sites source bundle
        shell: bash
        run: npm run build

  verify_live_autotube:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.verify_live)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify illcoai.tech Site and AutoTube MCP
        shell: bash
        env:
          SITE_URL: https://illcoai.tech
          AUTOTUBE_MCP_URL: https://illcoai.tech/api/chatgpt/autotube/mcp
          AUTOTUBE_WIDGET_URL: https://illcoai.tech/api/chatgpt/autotube/widget
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --retry-all-errors --max-time 30 "$SITE_URL/" > site.html
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --retry-all-errors --max-time 30 "$AUTOTUBE_MCP_URL" > autotube-health.json
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --retry-all-errors --max-time 30 "$AUTOTUBE_WIDGET_URL" > autotube-widget.html
          curl --fail --silent --show-error --location --max-time 30 --header 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"illco-production-verifier","version":"1.0.0"}}}' "$AUTOTUBE_MCP_URL" > autotube-initialize.json
          curl --fail --silent --show-error --location --max-time 30 --header 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' "$AUTOTUBE_MCP_URL" > autotube-tools.json

          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path('autotube-health.json').read_text(encoding='utf-8'))
          initialize = json.loads(Path('autotube-initialize.json').read_text(encoding='utf-8'))
          tools_payload = json.loads(Path('autotube-tools.json').read_text(encoding='utf-8'))
          tool_names = {str(tool.get('name')) for tool in ((tools_payload.get('result') or {}).get('tools') or [])}

          assert str(health.get('version') or '').startswith('5.1.0-autotube4'), health
          assert health.get('endpoint') == '/api/chatgpt/autotube/mcp', health
          assert initialize.get('result'), initialize
          assert 'autotube_render_video' in tool_names, tool_names
          assert len(Path('site.html').read_bytes()) > 1_000
          assert len(Path('autotube-widget.html').read_bytes()) > 500
          print('illcoai.tech AutoTube MCP verification passed')
          PY
