name: Verify ILLCO Command for Sites

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      verify_live:
        description: Verify the published illcoai.tech Site and MCP routes
        required: false
        type: boolean
        default: true

concurrency:
  group: illco-command-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/autotube-renderer/requirements.txt

      - name: Install AutoTube renderer dependencies
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg fonts-dejavu-core
          fi
          python -m pip install --requirement services/autotube-renderer/requirements.txt

      - name: Verify AutoTube renderer with a real FFmpeg smoke render
        shell: bash
        env:
          AUTOTUBE_DATA_DIR: ${{ runner.temp }}/autotube-data
          OPENMONTAGE_DATA_DIR: ${{ runner.temp }}/openmontage-data
          AUTOTUBE_RENDER_SERVICE_TOKEN: github-actions-test-token
        run: |
          python -m py_compile services/autotube-renderer/app.py services/autotube-renderer/smoke_test.py
          python services/autotube-renderer/smoke_test.py

      - name: Type check
        shell: bash
        run: npx tsc --noEmit --pretty false

      - name: Test
        shell: bash
        run: npm test

      - name: Build Sites source bundle
        shell: bash
        run: npm run build

  verify_live_mcp:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.verify_live)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify illcoai.tech Site and MCP routes
        shell: bash
        env:
          SITE_URL: https://illcoai.tech
          AUTOTUBE_MCP_URL: https://illcoai.tech/api/chatgpt/autotube/mcp
          AUTOTUBE_WIDGET_URL: https://illcoai.tech/api/chatgpt/autotube/widget
          DI2_MCP_URL: https://illcoai.tech/api/chatgpt/debate-intelligence/mcp
          DI2_WIDGET_URL: https://illcoai.tech/api/chatgpt/debate-intelligence/widget
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location \
            --retry 8 --retry-delay 5 --retry-all-errors \
            --max-time 30 "$SITE_URL/" > site.html

          curl --fail --silent --show-error --location \
            --retry 8 --retry-delay 5 --retry-all-errors \
            --max-time 30 "$AUTOTUBE_MCP_URL" > autotube-health.json

          curl --fail --silent --show-error --location \
            --retry 8 --retry-delay 5 --retry-all-errors \
            --max-time 30 "$AUTOTUBE_WIDGET_URL" > autotube-widget.html

          curl --fail --silent --show-error --location \
            --max-time 30 \
            --header 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"illco-production-verifier","version":"1.0.0"}}}' \
            "$AUTOTUBE_MCP_URL" > autotube-initialize.json

          curl --fail --silent --show-error --location \
            --max-time 30 \
            --header 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            "$AUTOTUBE_MCP_URL" > autotube-tools.json

          curl --fail --silent --show-error --location \
            --retry 8 --retry-delay 5 --retry-all-errors \
            --max-time 30 "$DI2_MCP_URL" > di2-health.json

          curl --fail --silent --show-error --location \
            --retry 8 --retry-delay 5 --retry-all-errors \
            --max-time 30 "$DI2_WIDGET_URL" > di2-widget.html

          curl --fail --silent --show-error --location \
            --max-time 30 \
            --header 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":11,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"illco-production-verifier","version":"1.0.0"}}}' \
            "$DI2_MCP_URL" > di2-initialize.json

          curl --fail --silent --show-error --location \
            --max-time 30 \
            --header 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":12,"method":"tools/list","params":{}}' \
            "$DI2_MCP_URL" > di2-tools.json

          curl --fail --silent --show-error --location \
            --max-time 30 \
            --header 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":13,"method":"tools/call","params":{"name":"render_debate_studio","arguments":{"title":"Production verifier","topic":"Debate Intelligence MCP"}}}' \
            "$DI2_MCP_URL" > di2-render-call.json

          curl --fail --silent --show-error --location \
            --max-time 30 \
            --header 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":14,"method":"resources/read","params":{"uri":"ui://illco/debate-intelligence/studio-v1.html"}}' \
            "$DI2_MCP_URL" > di2-resource.json

          python - <<'PY'
          import json
          from pathlib import Path

          autotube_health_payload = json.loads(Path("autotube-health.json").read_text(encoding="utf-8"))
          autotube_health = autotube_health_payload.get("health") or {}
          autotube_initialize = json.loads(Path("autotube-initialize.json").read_text(encoding="utf-8"))
          autotube_tools_payload = json.loads(Path("autotube-tools.json").read_text(encoding="utf-8"))
          autotube_tools = (autotube_tools_payload.get("result") or {}).get("tools") or []
          autotube_tool_names = {str(tool.get("name")) for tool in autotube_tools}

          assert autotube_health_payload.get("version") == "5.1.0-autotube4", autotube_health_payload
          assert autotube_health_payload.get("mcpUrl") == "https://illcoai.tech/api/chatgpt/autotube/mcp", autotube_health_payload
          assert autotube_health_payload.get("widgetUrl") == "https://illcoai.tech/api/chatgpt/autotube/widget", autotube_health_payload
          assert autotube_health.get("standardVersion") == "4.0.0", autotube_health
          assert autotube_health.get("styleEngineAvailable") is True, autotube_health
          assert autotube_health.get("qualityGateAvailable") is True, autotube_health
          assert autotube_initialize.get("result"), autotube_initialize
          assert "autotube_health_check" in autotube_tool_names, autotube_tool_names
          assert "autotube_render_video" in autotube_tool_names, autotube_tool_names

          di2_health = json.loads(Path("di2-health.json").read_text(encoding="utf-8"))
          di2_initialize = json.loads(Path("di2-initialize.json").read_text(encoding="utf-8"))
          di2_tools_payload = json.loads(Path("di2-tools.json").read_text(encoding="utf-8"))
          di2_tools = (di2_tools_payload.get("result") or {}).get("tools") or []
          di2_tool_names = {str(tool.get("name")) for tool in di2_tools}
          di2_render = json.loads(Path("di2-render-call.json").read_text(encoding="utf-8"))
          di2_resource = json.loads(Path("di2-resource.json").read_text(encoding="utf-8"))

          assert di2_health.get("status") == "ready", di2_health
          assert di2_health.get("endpoint") == "/api/chatgpt/debate-intelligence/mcp", di2_health
          assert di2_initialize.get("result"), di2_initialize
          assert "render_debate_studio" in di2_tool_names, di2_tool_names
          assert "run_debate_youtube_pipeline" in di2_tool_names, di2_tool_names
          assert not di2_render.get("error"), di2_render
          structured = (di2_render.get("result") or {}).get("structuredContent") or {}
          assert structured.get("studioStatus") == "ready", di2_render
          assert ((di2_render.get("result") or {}).get("_meta") or {}).get("ui", {}).get("resourceUri") == "ui://illco/debate-intelligence/studio-v1.html", di2_render
          contents = (di2_resource.get("result") or {}).get("contents") or []
          assert contents and contents[0].get("mimeType") == "text/html;profile=mcp-app", di2_resource

          assert len(Path("site.html").read_bytes()) > 1_000
          assert len(Path("autotube-widget.html").read_bytes()) > 500
          assert len(Path("di2-widget.html").read_bytes()) > 500
          print("illcoai.tech AutoTube + Debate Intelligence MCP verification passed")
          PY
