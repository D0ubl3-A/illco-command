name: Verify ILLCO Command for Sites

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      verify_live:
        description: Verify the published illcoai.tech Site and AutoTube MCP
        required: false
        type: boolean
        default: true

concurrency:
  group: illco-command-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/autotube-renderer/requirements.txt

      - name: Install AutoTube renderer dependencies
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg fonts-dejavu-core
          fi
          python -m pip install --requirement services/autotube-renderer/requirements.txt

      - name: Verify AutoTube renderer with a real FFmpeg smoke render
        shell: bash
        env:
          AUTOTUBE_DATA_DIR: ${{ runner.temp }}/autotube-data
          OPENMONTAGE_DATA_DIR: ${{ runner.temp }}/openmontage-data
          AUTOTUBE_RENDER_SERVICE_TOKEN: github-actions-test-token
        run: |
          python -m py_compile services/autotube-renderer/app.py services/autotube-renderer/smoke_test.py
          python services/autotube-renderer/smoke_test.py

      - name: Type check
        shell: bash
        run: npx tsc --noEmit --pretty false

      - name: Test
        shell: bash
        run: npm test

      - name: Build Sites source bundle
        shell: bash
        run: npm run build

  verify_live_autotube:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.verify_live)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify illcoai.tech Site and AutoTube MCP
        shell: bash
        env:
          SITE_URL: https://illcoai.tech
          AUTOTUBE_MCP_URL: https://illcoai.tech/api/chatgpt/autotube/mcp
          AUTOTUBE_WIDGET_URL: https://illcoai.tech/api/chatgpt/autotube/widget
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --retry-all-errors --max-time 30 "$SITE_URL/" > site.html
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --retry-all-errors --max-time 30 "$AUTOTUBE_MCP_URL" > autotube-health.json
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --retry-all-errors --max-time 30 "$AUTOTUBE_WIDGET_URL" > autotube-widget.html
          curl --fail --silent --show-error --location --max-time 30 --header 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"illco-production-verifier","version":"1.0.0"}}}' "$AUTOTUBE_MCP_URL" > autotube-initialize.json
          curl --fail --silent --show-error --location --max-time 30 --header 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' "$AUTOTUBE_MCP_URL" > autotube-tools.json

          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          health = json.loads(Path('autotube-health.json').read_text(encoding='utf-8'))
          initialize = json.loads(Path('autotube-initialize.json').read_text(encoding='utf-8'))
          tools_payload = json.loads(Path('autotube-tools.json').read_text(encoding='utf-8'))
          tool_names = {str(tool.get('name')) for tool in ((tools_payload.get('result') or {}).get('tools') or [])}

          version = str(health.get('version') or '')
          match = re.fullmatch(r'(\d+)\.(\d+)\.(\d+)-autotube4(?:-sites)?', version)
          assert match, health
          assert tuple(map(int, match.groups())) >= (5, 5, 0), health

          assert health.get('endpoint') == '/api/chatgpt/autotube/mcp', health
          assert health.get('mcpUrl') == os.environ['AUTOTUBE_MCP_URL'], health
          assert health.get('widgetUrl') == os.environ['AUTOTUBE_WIDGET_URL'], health

          runtime_health = health.get('health') or {}
          assert runtime_health.get('standardVersion') == '4.0.0', runtime_health
          assert runtime_health.get('styleEngineAvailable') is True, runtime_health
          assert runtime_health.get('qualityGateAvailable') is True, runtime_health
          assert runtime_health.get('renderServiceConfigured') is True, runtime_health
          assert runtime_health.get('narrationProviderConfigured') is True, runtime_health
          assert runtime_health.get('signedDeliveryConfigured') is True, runtime_health
          assert runtime_health.get('storageConfigured') is True, runtime_health

          assert initialize.get('result'), initialize
          required_tools = {
              'autotube_health_check',
              'autotube_render_video',
              'autotube_render_status',
              'autotube_get_video',
          }
          assert required_tools.issubset(tool_names), tool_names
          assert len(Path('site.html').read_bytes()) > 1_000
          assert len(Path('autotube-widget.html').read_bytes()) > 500
          print(f'illcoai.tech AutoTube MCP verification passed at {version}')
          PY

          # Green-100 live crawl-control and domain-ownership gates.
          curl --fail --silent --show-error --max-time 30 "$SITE_URL/robots.txt" > robots.txt
          curl --fail --silent --show-error --max-time 30 "$SITE_URL/sitemap.xml" > sitemap.xml

          python - <<'PY'
          from pathlib import Path

          robots = Path("robots.txt").read_text(encoding="utf-8").lower()
          sitemap = Path("sitemap.xml").read_text(encoding="utf-8").lower()

          assert "user-agent:" in robots, robots[:500]
          assert "sitemap: https://illcoai.tech/sitemap.xml" in robots, robots[:1000]
          assert "<urlset" in sitemap or "<sitemapindex" in sitemap, sitemap[:1000]

          forbidden = [
              "/local",
              "/henderson-ai-automation",
              "/henderson/ai-consulting",
              "/henderson/ai-receptionist",
              "/henderson/ai-automation",
              "/henderson/web-design",
              "/las-vegas/ai-agency",
              "/las-vegas/ai-consulting",
              "/las-vegas/ai-receptionist",
              "/las-vegas/ai-automation",
              "/las-vegas/small-business-automation",
              "/las-vegas/ai-lead-generation",
              "/las-vegas/ai-website-design",
              "/las-vegas/missed-call-text-back",
              "/las-vegas/ai-quote-builder-for-contractors",
          ]
          present = [path for path in forbidden if f"https://illcoai.tech{path}" in sitemap]
          assert not present, f"Commercial/local .tech URLs remain in sitemap: {present}"
          print("robots.txt and sitemap.xml Green-100 gates passed")
          PY

          check_redirect() {
            source="$1"
            expected="$2"
            headers="$(mktemp)"
            code="$(curl --silent --show-error --max-time 30 --output /dev/null --dump-header "$headers" --write-out '%{http_code}' "$SITE_URL$source")"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print}' "$headers" | tail -n 1)"
            rm -f "$headers"
            if [[ "$code" != "301" && "$code" != "308" ]]; then
              echo "Expected permanent redirect for $source, got HTTP $code"
              exit 1
            fi
            if [[ "$location" != "$expected" ]]; then
              echo "Wrong redirect owner for $source: $location (expected $expected)"
              exit 1
            fi
          }

          check_redirect "/local" "https://illcoai.com/services"
          check_redirect "/henderson-ai-automation" "https://illcoai.com/services"
          check_redirect "/henderson/ai-consulting" "https://illcoai.com/ai-consulting-henderson"
          check_redirect "/henderson/ai-receptionist" "https://illcoai.com/services"
          check_redirect "/henderson/ai-automation" "https://illcoai.com/services"
          check_redirect "/henderson/web-design" "https://illcoai.com/services"
          check_redirect "/las-vegas/ai-agency" "https://illcoai.com/ai-agency-las-vegas"
          check_redirect "/las-vegas/ai-consulting" "https://illcoai.com/ai-agency-las-vegas"
          check_redirect "/las-vegas/ai-receptionist" "https://illcoai.com/ai-receptionist-las-vegas"
          check_redirect "/las-vegas/ai-automation" "https://illcoai.com/small-business-automation-las-vegas"
          check_redirect "/las-vegas/small-business-automation" "https://illcoai.com/small-business-automation-las-vegas"
          check_redirect "/las-vegas/ai-lead-generation" "https://illcoai.com/ai-lead-generation-las-vegas"
          check_redirect "/las-vegas/ai-website-design" "https://illcoai.com/ai-website-design-las-vegas"
          check_redirect "/las-vegas/missed-call-text-back" "https://illcoai.com/ai-receptionist-las-vegas"
          check_redirect "/las-vegas/ai-quote-builder-for-contractors" "https://illcoai.com/services"

          echo "Commercial/local domain ownership redirects passed"
