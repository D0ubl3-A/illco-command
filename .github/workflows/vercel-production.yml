name: Verify and deploy ILLCO Command

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: illco-command-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        id: typecheck
        shell: bash
        run: |
          set -o pipefail
          npx tsc --noEmit --pretty false 2>&1 | tee typecheck.log

      - name: Upload type-check failure log
        if: failure() && steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-failure-log
          path: typecheck.log
          retention-days: 7

      - name: Test
        id: test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log

      - name: Upload test failure log
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-log
          path: test.log
          retention-days: 7

      - name: Build
        id: build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Upload build failure log
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build.log
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify deployment credentials
        shell: bash
        run: |
          test -n "${{ secrets.VERCEL_TOKEN }}" || (echo "Missing VERCEL_TOKEN secret" && exit 1)
          test -n "$VERCEL_ORG_ID" || (echo "Missing VERCEL_ORG_ID secret" && exit 1)
          test -n "$VERCEL_PROJECT_ID" || (echo "Missing VERCEL_PROJECT_ID secret" && exit 1)

      - name: Install dependencies
        run: npm ci

      - name: Pull production environment
        run: npx --yes vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build Vercel artifact
        run: npx --yes vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy production artifact
        run: npx --yes vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Verify critical production routes
        shell: bash
        run: |
          set -euo pipefail
          routes=(
            "https://illco-command.vercel.app/"
            "https://illco-command.vercel.app/lead-rescue"
            "https://illco-command.vercel.app/youtube-rank-revival"
            "https://illco-command.vercel.app/brain"
            "https://illco-command.vercel.app/label-command"
            "https://illco-command.vercel.app/api/label-command/health"
            "https://illco-command.vercel.app/tools/lyric-video-forge"
            "https://illco-command.vercel.app/tools/meme-mcp-server"
            "https://illco-command.vercel.app/api/health"
          )

          for route in "${routes[@]}"; do
            echo "Checking $route"
            curl --fail --silent --show-error --location \
              --retry 8 --retry-delay 5 --retry-all-errors \
              --max-time 30 "$route" > /dev/null
          done
