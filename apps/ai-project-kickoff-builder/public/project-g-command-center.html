<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{color-scheme:light dark;--b:#f4f6f8;--s:#fff;--t:#12161a;--m:#66717c;--l:#d9dee3;--g:#17a36f}@media(prefers-color-scheme:dark){:root{--b:#111315;--s:#1b1f23;--t:#f5f7f8;--m:#aab1b8;--l:#343a40}}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:14px system-ui}main{border:1px solid var(--l);border-radius:20px;background:var(--s);overflow:hidden}header{padding:18px;background:linear-gradient(120deg,#17a36f22,transparent)}h1,h2,h3{margin:0}.stats,.grid,.two{display:grid;gap:8px}.stats{grid-template-columns:repeat(4,1fr);margin-top:14px}.stat,.card,.panel{border:1px solid var(--l);border-radius:12px;padding:10px}.tabs{display:flex;gap:6px;overflow:auto;padding:10px;border-block:1px solid var(--l)}button,input,select,textarea{font:inherit}.tab,.btn{border:1px solid var(--l);border-radius:10px;padding:8px;background:var(--s);color:var(--t);cursor:pointer}.tab.active,.btn.primary{background:var(--t);color:var(--s)}.grid{grid-template-columns:290px 1fr;min-height:580px}.list{padding:8px;max-height:720px;overflow:auto;border-right:1px solid var(--l)}.card{margin-bottom:6px;cursor:pointer}.card.active{outline:2px solid var(--g)}.bar{height:6px;background:var(--l);border-radius:99px;overflow:hidden;margin:7px 0}.bar span{display:block;height:100%;background:var(--g)}.detail{padding:16px}.two{grid-template-columns:1fr 1fr}.muted{color:var(--m)}textarea,input,select{width:100%;padding:9px;border:1px solid var(--l);border-radius:9px;background:var(--s);color:var(--t);margin-top:7px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.feed{margin-top:10px}.pill{display:inline-block;border:1px solid var(--l);border-radius:99px;padding:3px 7px;font-size:11px;color:var(--m)}@media(max-width:760px){.stats,.grid,.two{grid-template-columns:1fr}.list{max-height:280px;border-right:0;border-bottom:1px solid var(--l)}}</style></head><body><!--PREVIEW--><main id="app"></main><script type="module">
let output=window.__PREVIEW__||window.openai?.toolOutput||null,state=window.openai?.widgetState?.privateContent||{},tab=state.tab||"overview";const app=document.querySelector('#app'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rpc(method,params){window.parent.postMessage({jsonrpc:'2.0',method,params},'*')}function follow(action,payload,instruction){const prompt=`PROJECT_G_PLUGIN_ACTION\n${JSON.stringify({action,payload,instruction})}\nUse the AI Project Kickoff Builder skill. Perform the work now with the matching Project G tool, then call render_project_g_dashboard for the affected project.`;if(window.openai?.sendFollowUpMessage)return window.openai.sendFollowUpMessage({prompt});rpc('ui/message',{prompt})}
function persist(p){window.openai?.setWidgetState?.({modelContent:`Project G UI: ${p.name}; section ${tab}; completion ${p.completionPercentage}%; readiness ${p.readinessScore}/100.`,privateContent:{tab,projectId:p.projectId}})}
function render(){if(!output){app.innerHTML='<div class="panel">Open the command center through ChatGPT.</div>';return}const d=output.dashboard,p=output.selectedProject||d.projects.find(x=>x.projectId===d.selectedProjectId)||d.projects[0],tools=output.toolCatalog||[];persist(p);app.innerHTML=`<header><h1>AI Project Kickoff Builder</h1><div class=muted>Project G in-chat controller · Aaron + Cody · evidence-based completion</div><div class=stats>${[['Projects',d.summary.projectCount],['Portfolio',d.summary.portfolioCompletionPercentage+'%'],['Readiness',d.summary.averageReadinessScore+'/100'],['Needs review',d.summary.needsReview]].map(x=>`<div class=stat><b>${x[1]}</b><div class=muted>${x[0]}</div></div>`).join('')}</div></header><nav class="tabs project-tabs">${d.projects.map(x=>`<button class="tab ${x.projectId===p.projectId?'active':''}" data-project="${x.projectId}">${esc(x.name)} · ${x.completionPercentage}%</button>`).join('')}</nav><div class=grid><aside class=list>${d.projects.map(x=>`<div class="card ${x.projectId===p.projectId?'active':''}" data-project="${x.projectId}"><b>${esc(x.name)}</b><div class=bar><span style="width:${x.completionPercentage}%"></span></div><small>${x.completionPercentage}% · ${x.readinessScore}/100</small></div>`).join('')}</aside><section class=detail><h2>${esc(p.name)}</h2><p>${esc(p.businessGoal)}</p><div class=two><div class=panel><h3>Aaron Allton · ${p.contributors['Aaron Allton'].visibleShare}%</h3><p class=muted>${esc(p.contributors['Aaron Allton'].work.join(' '))}</p></div><div class=panel><h3>Cody Rose · ${p.contributors['Cody Rose'].visibleShare}%</h3><p class=muted>${esc(p.contributors['Cody Rose'].work.join(' '))}</p></div></div><nav class=tabs>${['overview','updates','notes','ai','tools'].map(x=>`<button class="tab ${tab===x?'active':''}" data-tab="${x}">${x==='ai'?'Run with ChatGPT':x}</button>`).join('')}</nav><div id=panel>${panel(p,tools)}</div></section></div>`;app.querySelectorAll('[data-project]').forEach(e=>e.onclick=()=>follow('open_project',{projectId:e.dataset.project},'Call get_project_g_project, then render the selected project.'));app.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>{tab=e.dataset.tab;render()});bind(p)}
function panel(p,tools){if(tab==='overview')return `<div class=panel><span class=pill>${p.completionPercentage}% complete</span> <span class=pill>${p.completionConfidence} confidence</span><p>${esc(p.completionBasis)}</p><textarea id=basis>${esc(p.completionBasis)}</textarea><div class=two><input id=pct type=number min=0 max=100 value=${p.completionPercentage}><select id=conf>${['low','medium','high'].map(x=>`<option ${x===p.completionConfidence?'selected':''}>${x}</option>`).join('')}</select></div><div class=actions><button class="btn primary" id=progress>Ask ChatGPT to save progress</button><button class=btn id=validate>Validate</button></div></div>`;if(tab==='updates')return `<div class=panel><h3>Continue a section</h3><select id=section>${['overview','actions','deliverables','risks','communications'].map(x=>`<option>${x}</option>`).join('')}</select><select id=author><option>Aaron Allton</option><option>Cody Rose</option><option>Team</option></select><textarea id=text placeholder="Instruction, result, blocker, decision, or completed work"></textarea><button class="btn primary" id=update>Ask ChatGPT to save + continue</button><div class=feed>${p.sectionUpdates.map(u=>`<div class=card><b>${esc(u.author)} · ${esc(u.section)}</b><p>${esc(u.text)}</p></div>`).join('')||'<p class=muted>No updates yet.</p>'}</div></div>`;if(tab==='notes')return `<div class=panel><h3>Aaron ↔ Cody notes</h3><div class=two><select id=from><option>Aaron Allton</option><option>Cody Rose</option></select><select id=to><option>Cody Rose</option><option>Aaron Allton</option><option>Team</option></select></div><textarea id=note placeholder="Project handoff, question, or decision request"></textarea><button class="btn primary" id=addnote>Ask ChatGPT to leave note</button><div class=feed>${p.notes.map(n=>`<div class=card><b>${esc(n.author)} → ${esc(n.recipient)}</b> <span class=pill>${n.status}</span><p>${esc(n.text)}</p>${n.status==='open'?`<button class=btn data-resolve="${n.id}">Resolve</button>`:''}</div>`).join('')||'<p class=muted>No notes yet.</p>'}</div></div>`;if(tab==='ai')return `<div class=panel><h3>Run directly through ChatGPT</h3><textarea id=instruction placeholder="Optional instruction"></textarea><div class=actions>${['full_project_pass','continue_section','audit_section','fix_blockers','generate_deliverables','validate_and_replan','prepare_status_report','resolve_notes','stakeholder_brief'].map(x=>`<button class=btn data-action="${x}">${x.replaceAll('_',' ')}</button>`).join('')}</div></div>`;return `<div class=panel><h3>All Project G tools</h3>${tools.map(t=>`<div class=card><b>${esc(t.name)}</b> <span class=pill>${t.mode}</span><p class=muted>${esc(t.purpose)}</p></div>`).join('')}</div>`}
function bind(p){document.querySelector('#progress')?.addEventListener('click',()=>follow('update_progress',{projectId:p.projectId,completionPercentage:Number(document.querySelector('#pct').value),completionConfidence:document.querySelector('#conf').value,basisNote:document.querySelector('#basis').value},'Call update_project_g_progress, validate, then refresh.'));document.querySelector('#validate')?.addEventListener('click',()=>follow('validate',{projectId:p.projectId},'Call validate_project_g_project and refresh.'));document.querySelector('#update')?.addEventListener('click',()=>follow('section_update',{projectId:p.projectId,section:document.querySelector('#section').value,author:document.querySelector('#author').value,updateText:document.querySelector('#text').value},'Call add_project_g_section_update, continue the requested work now, save verified results, then refresh.'));document.querySelector('#addnote')?.addEventListener('click',()=>follow('add_note',{projectId:p.projectId,author:document.querySelector('#from').value,recipient:document.querySelector('#to').value,section:'general',noteText:document.querySelector('#note').value},'Call add_project_g_note and refresh.'));document.querySelectorAll('[data-resolve]').forEach(e=>e.onclick=()=>follow('resolve_note',{projectId:p.projectId,noteId:e.dataset.resolve,status:'resolved'},'Call set_project_g_note_status and refresh.'));document.querySelectorAll('[data-action]').forEach(e=>e.onclick=()=>follow('run_assistant_action',{projectId:p.projectId,author:'Team',section:'overview',action:e.dataset.action,instruction:document.querySelector('#instruction').value},'Call run_project_g_assistant_action, execute its assistantPrompt using required tools, then refresh.'))}
window.addEventListener('message',e=>{const m=e.data;if(m?.method==='ui/notifications/tool-result'){output=m.params?.structuredContent||m.params;render()}});render();
</script></body></html>
