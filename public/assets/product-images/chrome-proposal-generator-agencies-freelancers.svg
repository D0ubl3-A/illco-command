        </div>
      </div>
      <div class="bottom">
        <div class="price">$599</div>
        <div class="cta">Get this product now</div>
        <div class="meta">Proposal generator &#8226; Agencies, freelancers, consultants, and operators writing proposals from scattered prospect notes.</div>
      </div>
