      <div>
        <div class="brand"><strong>illco</strong><span>AI</span></div>
        <div class="tag">Growth</div>
        <div class="metric">Top outcome: Warm lead lift</div>
        <div class="meter"><span class="meter-fill"></span></div>
        <div class="badge">chrome-proposal-generator-agencies-freelancers</div>
        <h1>Chrome Proposal Generator for Agencies &amp; Freelancers</h1>
        <p class="headline">Turn prospect context into structured scopes, pricing rationale, and closing copy.</p>
        <p class="copy">A Chrome proposal generator for agencies and freelancers who need faster, clearer sales documents.</p>
        <p class="audience">Agencies, freelancers, consultants, and operators writing proposals from</p>
        <p class="value">Proposal delay kills momentum. This product turns context into a scoped first draft while intent is still warm.</p>
        <p class="copy" style="font-size: 24px; max-width: 780px; margin-top: 8px;">Built to move users from interest to action</p>
        <div class="outcomes">
