<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><foreignObject width="1200" height="675"><![CDATA[
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Chrome Proposal Generator for Agencies &amp; Freelancers</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: Inter, Arial, sans-serif;
      }
      body {
        width: 100%;
        height: 100%;
        display: grid;
        align-items: stretch;
        background:
          radial-gradient(circle at 72% 25%, rgba(255,255,255,.12), transparent 35%),
          linear-gradient(135deg, #021027 0%, #0f3f7f 56%, #060c1b 100%);
