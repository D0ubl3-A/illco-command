        align-content: space-between;
        isolation: isolate;
      }
      .halo {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 22% 80%, rgba(102, 242, 255, .32), transparent 55%),
          radial-gradient(circle at 82% 18%, rgba(102, 242, 255, .32), transparent 44%);
