  <path d="M206 124 303 68l151 88-64 38-86-50-34 20v184l39 22 82-48 62 38-149 86-98-57V124Z" fill="url(#cGrad)" filter="url(#softGlow)"/>
  <path d="M300 219 369 258 300 297V219Z" fill="#ff2b25"/>
