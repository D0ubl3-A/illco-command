<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Control Plane</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #151515;
        --muted: #5e646e;
        --line: #d8dde4;
        --paper: #f7f5ef;
        --panel: #ffffff;
        --accent: #0f766e;
        --warn: #a16207;
        --bad: #b42318;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(135deg, rgba(15, 118, 110, 0.12), transparent 38%),
          linear-gradient(315deg, rgba(161, 98, 7, 0.12), transparent 36%),
          var(--paper);
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
      }

      main {
        width: min(980px, calc(100% - 32px));
        margin: 0 auto;
        padding: 48px 0;
      }

      header {
        display: grid;
        gap: 12px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 28px;
      }

      h1 {
        margin: 0;
        font-size: clamp(36px, 7vw, 76px);
        line-height: 0.96;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.5;
        max-width: 720px;
      }

      section {
        display: grid;
        gap: 16px;
        margin-top: 28px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 12px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 18px;
        box-shadow: 0 12px 30px rgba(22, 24, 29, 0.08);
      }

      .label {
        color: var(--muted);
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0;
      }

      .value {
        margin-top: 8px;
        font-family: Consolas, "Courier New", monospace;
        overflow-wrap: anywhere;
      }

      .ok {
        color: var(--accent);
      }

      .warn {
        color: var(--warn);
      }

      .bad {
        color: var(--bad);
      }

      a {
        color: var(--accent);
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
      }

      code {
        font-family: Consolas, "Courier New", monospace;
        font-size: 0.92em;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Live Control Plane</h1>
        <p>Serverless HTTP control layer for the one-to-many AI livestream producer.</p>
      </header>

      <section class="grid">
        <div class="card">
          <div class="label">API</div>
          <div class="value" id="api-status">checking</div>
        </div>
        <div class="card">
          <div class="label">Redis</div>
          <div class="value" id="redis-status">checking</div>
        </div>
        <div class="card">
          <div class="label">Database</div>
          <div class="value" id="db-status">checking</div>
        </div>
      </section>

      <section class="card">
        <div class="label">Producer Page</div>
        <div class="value">
          <a href="/producer/channel/abc123">/producer/channel/abc123</a>
        </div>
      </section>

      <section class="card">
        <div class="label">Health Endpoint</div>
        <div class="value">
          <a href="/api/health">/api/health</a>
        </div>
      </section>
    </main>

    <script>
      const api = document.getElementById("api-status");
      const redis = document.getElementById("redis-status");
      const db = document.getElementById("db-status");

      fetch("/api/health", { cache: "no-store" })
        .then((response) => response.json())
        .then((health) => {
          api.textContent = health.ok ? "online" : "unhealthy";
          api.className = health.ok ? "value ok" : "value bad";
          redis.textContent = health.redisConfigured ? "configured" : "missing REDIS_URL";
          redis.className = health.redisConfigured ? "value ok" : "value warn";
          db.textContent = health.databaseConfigured ? "configured" : "not configured";
          db.className = health.databaseConfigured ? "value ok" : "value warn";
        })
        .catch((error) => {
          api.textContent = String(error && error.message ? error.message : error);
          api.className = "value bad";
          redis.textContent = "unknown";
          db.textContent = "unknown";
        });
    </script>
  </body>
</html>
