<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Producer Stream Page</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b0c10;
        color: #e5e5e5;
        font-family: Arial, sans-serif;
      }
      #root {
        display: grid;
        height: 100%;
        grid-template-rows: 1fr auto;
      }
      #status {
        padding: 10px;
        font-size: 12px;
        white-space: pre-wrap;
        border-top: 1px solid #222;
        background: #16181d;
        min-height: 140px;
        overflow: auto;
      }
      #videoWrap {
        position: relative;
      }
      #videoWrap video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="videoWrap">
        <video id="avatarVideo" autoplay playsinline></video>
      </div>
      <div id="status">Starting producer...</div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
      const params = new URLSearchParams(location.search);
      const token = params.get("token") || "";
      const channelId = params.get("channelId") || location.pathname.split("/").pop();
      const statusElement = document.getElementById("status");
      const activeCommands = new Map();
      const completedCommands = new Set();
      const speakQueue = [];
      const MAX_STATUS_LINES = 200;
      let heartbeatTimer;
      let pollTimer;
      let processingQueue = false;
      let socket = null;

      function log(message) {
        const line = `[${new Date().toISOString()}] ${message}`;
        statusElement.textContent += `\n${line}`;
        const lines = statusElement.textContent.split("\n");
        if (lines.length > MAX_STATUS_LINES) {
          statusElement.textContent = lines.slice(lines.length - MAX_STATUS_LINES).join("\n");
        }
        statusElement.scrollTop = statusElement.scrollHeight;
      }

      async function emitStatus(payload, type, detail = "") {
        const event = {
          channelId,
          messageId: payload.messageId,
          commandId: payload.commandId,
          attempt: payload.attempt,
          type,
          detail,
        };
        if (socket && socket.connected) {
          socket.emit("producer:status", event);
          return;
        }
        await fetch(`/api/producers/${encodeURIComponent(channelId)}/events?token=${encodeURIComponent(token)}`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(event),
          keepalive: true,
        });
      }

      function trimText(input) {
        return String(input || "").trim();
      }

      function getDidAgent() {
        return window.agentManager || window.didAgent || window.DID || window.DIdAgent || null;
      }

      function commandKey(payload) {
        return String(payload.commandId || `${payload.messageId}:primary`);
      }

      function rememberCompleted(commandId) {
        completedCommands.add(commandId);
        while (completedCommands.size > 300) {
          const oldest = completedCommands.values().next().value;
          completedCommands.delete(oldest);
        }
      }

      function isExpired(payload) {
        const ttlMs = Number(payload.ttlMs || 0);
        const generatedAt = Date.parse(payload.generatedAt || "");
        return ttlMs > 0 && Number.isFinite(generatedAt) && Date.now() - generatedAt > ttlMs;
      }

      async function playWithDid(payload) {
        const input = trimText(payload.text);
        if (!input) {
          throw new Error("empty_speak_input");
        }
        const didAgent = getDidAgent();
        if (!didAgent) {
          throw new Error("d_id_agent_not_ready");
        }

        const command = { type: "text", input };
        if (typeof didAgent.speak === "function") {
          await didAgent.speak(command);
          return;
        }
        if (typeof didAgent.createAgent === "function") {
          await didAgent.createAgent(command);
          return;
        }
        if (didAgent.agent && typeof didAgent.agent.speak === "function") {
          await didAgent.agent.speak(command);
          return;
        }

        throw new Error("d_id_speak_unsupported");
      }

      async function runNextSpeakCommand() {
        if (processingQueue || speakQueue.length === 0) {
          return;
        }
        processingQueue = true;
        const payload = speakQueue.shift();
        if (!payload || !payload.messageId) {
          processingQueue = false;
          return;
        }

        const id = commandKey(payload);
        if (activeCommands.has(id) || completedCommands.has(id)) {
          processingQueue = false;
          runNextSpeakCommand();
          return;
        }

        if (isExpired(payload)) {
          await emitStatus(payload, "avatar_error", "command_expired");
          processingQueue = false;
          runNextSpeakCommand();
          return;
        }

        activeCommands.set(id, true);
        await emitStatus(payload, "accepted_for_render");
        try {
          await emitStatus(payload, "avatar_started");
          await playWithDid(payload);
          await emitStatus(payload, "avatar_finished");
        } catch (error) {
          await emitStatus(payload, "avatar_error", String(error?.message || error));
        } finally {
          activeCommands.delete(id);
          rememberCompleted(id);
          processingQueue = false;
          runNextSpeakCommand();
          if (!socket || !socket.connected) {
            scheduleHttpPoll(250);
          }
        }
      }

      function scheduleHttpPoll(ms) {
        if (pollTimer) {
          clearTimeout(pollTimer);
        }
        pollTimer = setTimeout(pollNextCommand, ms);
      }

      async function pollNextCommand() {
        if (socket && socket.connected) {
          return;
        }
        if (processingQueue || speakQueue.length > 0) {
          scheduleHttpPoll(500);
          return;
        }

        try {
          const response = await fetch(
            `/api/producers/${encodeURIComponent(channelId)}/next?token=${encodeURIComponent(token)}`,
            { cache: "no-store" }
          );
          if (response.status === 204) {
            scheduleHttpPoll(1200);
            return;
          }
          if (!response.ok) {
            log(`poll_error ${response.status}`);
            scheduleHttpPoll(3000);
            return;
          }
          const payload = await response.json();
          if (payload?.command?.messageId) {
            const id = commandKey(payload.command);
            if (!activeCommands.has(id) && !completedCommands.has(id)) {
              speakQueue.push(payload.command);
              await runNextSpeakCommand();
            }
            scheduleHttpPoll(250);
            return;
          }
          scheduleHttpPoll(1200);
        } catch (error) {
          log(`poll_error ${String(error?.message || error)}`);
          scheduleHttpPoll(3000);
        }
      }

      function setupSocket() {
        if (typeof io !== "function") {
          log("socket unavailable; using HTTP polling");
          scheduleHttpPoll(200);
          return;
        }

        socket = io("/producer", {
          auth: { token },
          transports: ["websocket", "polling"],
        });

        socket.on("connect_error", (err) => {
          log(`connect_error ${err.message}`);
          scheduleHttpPoll(1000);
        });

        socket.on("connect", () => {
          log("connected to producer namespace");
          socket.emit("producer:request_state");
          if (pollTimer) {
            clearTimeout(pollTimer);
          }
          if (heartbeatTimer) {
            clearInterval(heartbeatTimer);
          }
          heartbeatTimer = setInterval(() => {
            socket.emit("producer:heartbeat", { channelId, ts: Date.now() });
          }, 4000);
        });

        socket.on("disconnect", () => {
          log("disconnected");
          clearInterval(heartbeatTimer);
          scheduleHttpPoll(1000);
        });

        socket.on(`channel:${channelId}:state`, (state) => {
          log(`state ${JSON.stringify(state)}`);
        });

        socket.on(`channel:${channelId}:speak`, (payload) => {
          if (!payload?.messageId) {
            return;
          }
          const id = commandKey(payload);
          if (activeCommands.has(id) || completedCommands.has(id)) {
            return;
          }
          speakQueue.push(payload);
          runNextSpeakCommand();
        });
      }

      setupSocket();
      log(`producer ready for channel ${channelId}`);
    </script>
  </body>
</html>
