<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Lyric Video Forge product visual</title>
  <desc id="desc">A dedicated thumbnail image for the Lyric Video Forge product page and tool catalog listing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1220"/>
      <stop offset="0.52" stop-color="#141d2d"/>
      <stop offset="1" stop-color="#1a1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
